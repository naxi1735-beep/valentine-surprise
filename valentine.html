<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>给你的情人节礼物</title>
<style>
#text {
  color: white;
  text-shadow:
    0 0 6px rgba(255,255,255,0.9),
    0 0 12px rgba(255,255,255,0.6),
    0 0 20px rgba(255,255,255,0.3);
}

#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

body {
    background: #0f0f14;
    color: #e6e6eb;
    font-family: "Microsoft YaHei", sans-serif;
    text-align: center;
    padding-top: 120px;
}

button {
    background: #2a2a38;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #44445a;
}

#message {
    margin-top: 30px;
    font-size: 18px;
    min-height: 60px;
}

#Akira {
    margin-top: 40px;
    font-size: 60px;
    display: none;
}
</style>
</head>

<body>

<h2>Someone missing you today...let's figure it out!</h2>

<button onclick="nextStep()">Click here!</button>

<div id="message"></div>
<img id="Akira" src="Akira.png" style="display:none; filter: brightness(0) invert(1); opacity:0; transition: opacity 1s;">
<audio id="bgm" loop>
  <source src="Akira.mp3" type="audio/mpeg">
</audio>




<script>
let step = 0;

const messages = [
"あ、見つけた——君に会えてすごく嬉しい。今日は私のこと、ちょっとは思い出した？",
"チョコ持ってきたよ。食べさせてあげようか~★",
"君がいるだけで、毎日が少し特別になる。これからも、そばにいさせて。",
"この世でいちばん愛しい君に、極限を超えた幸せを贈る。",
"……",
"ハッピーバレンタイン。"
];
function showSparkles() {
  for (let i = 0; i < 12; i++) {
    const dot = document.createElement("div");
    dot.style.position = "fixed";
    dot.style.width = "3px";
    dot.style.height = "3px";
    dot.style.background = "white";
    dot.style.left = Math.random() * 100 + "vw";
    dot.style.top = "100vh";
    dot.style.opacity = 0.7;
    dot.style.transition = "all 2s linear";

    document.body.appendChild(dot);

    setTimeout(() => {
      dot.style.top = "60vh";
      dot.style.opacity = 0;
    }, 50);
  }
}

function nextStep(){
    if(step < messages.length){
        document.getElementById("message").innerText = messages[step];
        step++;
    }else{
        document.getElementById("ghost").style.display = "block";
        document.getElementById("message").innerText = "他出现了。";
    }
}
</script>
<script>
  window.onload = function() {
    setTimeout(() => {
      const img = document.getElementById("Akira");
      img.style.display = "block";      // 先显示元素
      setTimeout(() => { img.style.opacity = 1; }, 50); // 再淡入
    }, 1000); // 延迟时间，可调，单位毫秒
  };
</script>
<script>
document.body.addEventListener("click", function () {
  document.getElementById("bgm").play();
}, { once: true });
</script>
<canvas id="particles"></canvas>


</body>
</html>
